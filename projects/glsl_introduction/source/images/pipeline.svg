<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="Meiryo, 'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#ffffff"/>
  <!-- 1 段目 -->
  <rect x="20" y="30" width="150" height="60" rx="8" fill="#eeeeee" stroke="#888"/>
  <text x="95" y="56" text-anchor="middle">頂点データ</text>
  <text x="95" y="76" text-anchor="middle" font-size="12" fill="#555">位置・色・法線など</text>

  <rect x="220" y="30" width="150" height="60" rx="8" fill="#d6e8ff" stroke="#3a78c2" stroke-width="2"/>
  <text x="295" y="56" text-anchor="middle" font-weight="bold">頂点シェーダー</text>
  <text x="295" y="76" text-anchor="middle" font-size="12" fill="#555">頂点ごとに実行</text>

  <rect x="420" y="30" width="150" height="60" rx="8" fill="#eeeeee" stroke="#888"/>
  <text x="495" y="56" text-anchor="middle">プリミティブの</text>
  <text x="495" y="76" text-anchor="middle">組み立て</text>

  <rect x="590" y="30" width="150" height="60" rx="8" fill="#eeeeee" stroke="#888"/>
  <text x="665" y="56" text-anchor="middle">ラスタライズ</text>
  <text x="665" y="76" text-anchor="middle" font-size="12" fill="#555">フラグメントを生成</text>

  <line x1="170" y1="60" x2="218" y2="60" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="370" y1="60" x2="418" y2="60" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="60" x2="588" y2="60" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 折り返し -->
  <path d="M665,90 L665,130 L95,130 L95,168" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2 段目 -->
  <rect x="20" y="170" width="150" height="60" rx="8" fill="#ffe2cc" stroke="#d2691e" stroke-width="2"/>
  <text x="95" y="196" text-anchor="middle" font-weight="bold">フラグメント</text>
  <text x="95" y="216" text-anchor="middle" font-weight="bold">シェーダー</text>

  <rect x="220" y="170" width="200" height="60" rx="8" fill="#eeeeee" stroke="#888"/>
  <text x="320" y="196" text-anchor="middle">フラグメント単位の処理</text>
  <text x="320" y="216" text-anchor="middle" font-size="12" fill="#555">深度テスト・ブレンドなど</text>

  <rect x="470" y="170" width="160" height="60" rx="8" fill="#eeeeee" stroke="#888"/>
  <text x="550" y="196" text-anchor="middle">フレームバッファー</text>
  <text x="550" y="216" text-anchor="middle" font-size="12" fill="#555">画面・テクスチャ</text>

  <line x1="170" y1="200" x2="218" y2="200" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="200" x2="468" y2="200" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 凡例 -->
  <rect x="20" y="258" width="18" height="18" rx="3" fill="#d6e8ff" stroke="#3a78c2" stroke-width="2"/>
  <rect x="42" y="258" width="18" height="18" rx="3" fill="#ffe2cc" stroke="#d2691e" stroke-width="2"/>
  <text x="68" y="272">GLSL でプログラムを書く段階</text>
  <rect x="300" y="258" width="18" height="18" rx="3" fill="#eeeeee" stroke="#888"/>
  <text x="326" y="272">GPU が決まった処理を行う段階（設定のみ変更できる）</text>
</svg>
