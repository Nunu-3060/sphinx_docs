<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="Meiryo, 'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="14">
  <defs>
    <marker id="a-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d2691e"/></marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a78c2"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a2be2"/></marker>
  </defs>
  <rect width="560" height="300" fill="#ffffff"/>
  <!-- 表面 -->
  <line x1="40" y1="240" x2="520" y2="240" stroke="#555" stroke-width="3"/>
  <text x="440" y="265" fill="#555">表面</text>
  <!-- 原点 (280, 240) -->
  <!-- N：真上 -->
  <line x1="280" y1="240" x2="280" y2="70" stroke="#222" stroke-width="2.5" marker-end="url(#a-black)"/>
  <text x="272" y="66" font-weight="bold" text-anchor="end">N</text>
  <text x="272" y="84" font-size="12" fill="#555" text-anchor="end">法線</text>
  <!-- L：左上（光源方向）角度 45° -->
  <line x1="280" y1="240" x2="150" y2="110" stroke="#d2691e" stroke-width="2.5" marker-end="url(#a-orange)"/>
  <text x="120" y="100" font-weight="bold" fill="#d2691e">L</text>
  <text x="60" y="120" font-size="12" fill="#d2691e">光源への方向</text>
  <!-- R：右上（反射方向）45° -->
  <line x1="280" y1="240" x2="410" y2="110" stroke="#8a2be2" stroke-width="2.5" marker-end="url(#a-purple)"/>
  <text x="414" y="104" font-weight="bold" fill="#8a2be2">R</text>
  <text x="430" y="122" font-size="12" fill="#8a2be2">反射方向</text>
  <!-- V：右上 やや低め（約 25°） -->
  <line x1="280" y1="240" x2="450" y2="165" stroke="#3a78c2" stroke-width="2.5" marker-end="url(#a-blue)"/>
  <text x="456" y="165" font-weight="bold" fill="#3a78c2">V</text>
  <text x="456" y="183" font-size="12" fill="#3a78c2">カメラへの方向</text>
  <!-- H：L と V の中間 -->
  <line x1="280" y1="240" x2="311" y2="73" stroke="#2e8b57" stroke-width="2.5" marker-end="url(#a-green)"/>
  <text x="318" y="92" font-weight="bold" fill="#2e8b57">H</text>
  <text x="334" y="92" font-size="12" fill="#2e8b57">ハーフベクトル</text>
  <!-- 角度記号 -->
  <path d="M280,190 A50,50 0 0 0 244.6,204.6" fill="none" stroke="#d2691e" stroke-width="1.5"/>
  <text x="252" y="182" font-size="13" fill="#d2691e">θ</text>
</svg>
