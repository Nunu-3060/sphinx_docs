<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" width="480" height="330" font-family="sans-serif" font-size="14">
  <rect x="0" y="0" width="480" height="330" fill="#ffffff"/>
  <!-- user space -->
  <rect x="20" y="15" width="300" height="130" rx="6" fill="#eef4fb" stroke="#4a78b0" stroke-dasharray="6 3"/>
  <text x="30" y="35" fill="#2b4c74" font-size="13">ユーザーランド（ユーザーモード）</text>
  <rect x="40" y="48" width="80" height="40" rx="4" fill="#ffffff" stroke="#4a78b0"/>
  <text x="80" y="73" text-anchor="middle">ブラウザ</text>
  <rect x="130" y="48" width="80" height="40" rx="4" fill="#ffffff" stroke="#4a78b0"/>
  <text x="170" y="73" text-anchor="middle">エディタ</text>
  <rect x="220" y="48" width="80" height="40" rx="4" fill="#ffffff" stroke="#4a78b0"/>
  <text x="260" y="73" text-anchor="middle">シェル</text>
  <rect x="40" y="98" width="260" height="34" rx="4" fill="#ffffff" stroke="#4a78b0"/>
  <text x="170" y="120" text-anchor="middle">ライブラリ（C 標準ライブラリなど）</text>
  <!-- syscall boundary -->
  <line x1="10" y1="165" x2="470" y2="165" stroke="#b04a4a" stroke-width="2"/>
  <text x="335" y="158" fill="#b04a4a" font-size="13">システムコール</text>
  <line x1="170" y1="132" x2="170" y2="190" stroke="#b04a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- kernel -->
  <rect x="20" y="190" width="440" height="70" rx="6" fill="#fbf1e6" stroke="#b07a3a"/>
  <text x="30" y="210" fill="#7a4e1c" font-size="13">カーネル（カーネルモード）</text>
  <text x="240" y="240" text-anchor="middle" font-size="13">プロセス管理・メモリ管理・ファイルシステム・デバイスドライバ</text>
  <!-- hardware -->
  <rect x="20" y="275" width="440" height="40" rx="6" fill="#ececec" stroke="#666666"/>
  <text x="240" y="300" text-anchor="middle">ハードウェア（CPU・メモリ・ストレージ・装置）</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04a4a"/>
    </marker>
  </defs>
</svg>
