# Settings for flake8 and mypy. Run them in the examples folder:
#   python -m flake8 .
#   python -m mypy .
# Keep this file ASCII only: mypy on Windows reads it with the system code page.

[flake8]
max-line-length = 120
exclude = __pycache__

[mypy]
strict = True

# matplotlib's 3D graphs (mpl_toolkits) do not ship type hints. Ignore import errors for them.
[mypy-mpl_toolkits.*]
ignore_missing_imports = True
