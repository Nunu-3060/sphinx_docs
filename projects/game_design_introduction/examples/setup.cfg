# Settings for checking the sample code.
# Run the following commands in this directory (examples):
#   python -m flake8
#   python -m mypy .
# The figure scripts in ../source/_scripts are checked with the same settings:
#   python -m flake8 --config setup.cfg ../source/_scripts
#   python -m mypy --config-file setup.cfg ../source/_scripts
# Keep this file ASCII only: mypy reads it with the locale encoding
# (cp932 on Japanese Windows), so non-ASCII characters break it.

[flake8]
max-line-length = 120
exclude = .mypy_cache,__pycache__,build,dist

[mypy]
strict = True
