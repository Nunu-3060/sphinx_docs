# Settings for flake8, mypy and coverage.py.
# ch04_before.py is an intentionally bad example, so it is excluded.
# (Comments are kept ASCII-only because mypy may read this file
#  with the platform default encoding.)

[flake8]
exclude = .git,.nox,.venv,__pycache__,reports,ch04_before.py
max-complexity = 10

[mypy]
strict = True
exclude = (ch04_before\.py|\.nox/|\.venv/)

[coverage:run]
branch = True
omit =
    ch04_before.py
    noxfile.py
    test_*.py

[coverage:report]
show_missing = True
