# Settings for flake8 and mypy. Run them in the examples folder:
#   python -m flake8 .
#   python -m mypy .
# The figure scripts in source/_scripts are checked with the same settings
# (see check_examples.bat in the project folder).

[flake8]
max-line-length = 120
exclude = __pycache__,.mypy_cache

[mypy]
strict = True
