# Settings for checking the Python sample code under this directory.
# Run the following commands in this directory (examples):
#   py -m flake8
#   py -m mypy python houdini
# Keep this file ASCII only: mypy reads it with the locale encoding
# (cp932 on Japanese Windows), so non-ASCII characters break it.

[flake8]
max-line-length = 120
exclude = .mypy_cache,__pycache__,out,godot

[mypy]
strict = True
# Each directory is a flat collection of scripts, not a package.
explicit_package_bases = True
mypy_path = python:houdini

# The hou module can only be imported inside Houdini and has no type stubs.
[mypy-hou]
ignore_missing_imports = True

# matplotlib's 3D toolkit has no type information.
[mypy-mpl_toolkits.*]
ignore_missing_imports = True
