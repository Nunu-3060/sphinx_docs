# Settings for flake8 and mypy. Run them in the examples folder:
#   python -m flake8 .
#   python -m mypy .

[flake8]
max-line-length = 120
exclude = __pycache__

[mypy]
strict = True

# The following packages do not ship type hints. Ignore import errors for them.
# mpl_toolkits: 3D graphs of matplotlib
[mypy-mpl_toolkits.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-sympy.*]
ignore_missing_imports = True
