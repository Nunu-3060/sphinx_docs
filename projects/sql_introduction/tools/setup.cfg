# Settings for flake8 and mypy. Run them in the tools folder:
#   python -m flake8 .
#   python -m mypy .

[flake8]
max-line-length = 79
exclude = __pycache__,templates

[mypy]
strict = True
# generate_docs.py imports split_statements from examples/run_query.py.
mypy_path = $MYPY_CONFIG_FILE_DIR/../examples
