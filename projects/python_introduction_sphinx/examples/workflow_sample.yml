# GitHub Actions で Sphinx のドキュメントをビルドし、GitHub Pages に公開する例です。
# リポジトリに .github/workflows/docs.yml として置きます。
# リポジトリの Settings > Pages で、Source に "GitHub Actions" を選択しておきます。

name: docs

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build HTML
        run: python -m sphinx -b html -W source build/html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
