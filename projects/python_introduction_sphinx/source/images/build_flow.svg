<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" font-family="Meiryo, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="220" fill="#ffffff"/>

  <!-- Sources -->
  <rect x="20" y="60" width="150" height="100" rx="8" fill="#e8f0fb" stroke="#3b6fb6" stroke-width="2"/>
  <text x="95" y="98" font-size="16" text-anchor="middle" fill="#1d3a66">ソースファイル</text>
  <text x="95" y="122" font-size="13" text-anchor="middle" fill="#1d3a66">.rst / .md</text>
  <text x="95" y="142" font-size="13" text-anchor="middle" fill="#1d3a66">conf.py</text>

  <line x1="170" y1="110" x2="265" y2="110" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="218" y="98" font-size="13" text-anchor="middle" fill="#333">読み込み</text>

  <!-- doctree -->
  <rect x="270" y="60" width="150" height="100" rx="8" fill="#eaf6ec" stroke="#3c8a4a" stroke-width="2"/>
  <text x="345" y="104" font-size="16" text-anchor="middle" fill="#1f4d27">doctree</text>
  <text x="345" y="128" font-size="13" text-anchor="middle" fill="#1f4d27">（木構造のデータ）</text>

  <line x1="420" y1="110" x2="515" y2="47" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="110" x2="515" y2="110" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="110" x2="515" y2="173" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="468" y="205" font-size="13" text-anchor="middle" fill="#333">ビルダーが出力</text>

  <!-- Outputs -->
  <rect x="520" y="20" width="180" height="50" rx="8" fill="#fbf1e6" stroke="#b8712d" stroke-width="2"/>
  <text x="610" y="51" font-size="15" text-anchor="middle" fill="#5c360f">HTML</text>
  <rect x="520" y="85" width="180" height="50" rx="8" fill="#fbf1e6" stroke="#b8712d" stroke-width="2"/>
  <text x="610" y="116" font-size="15" text-anchor="middle" fill="#5c360f">LaTeX（PDF）</text>
  <rect x="520" y="150" width="180" height="50" rx="8" fill="#fbf1e6" stroke="#b8712d" stroke-width="2"/>
  <text x="610" y="181" font-size="15" text-anchor="middle" fill="#5c360f">EPUB など</text>
</svg>
