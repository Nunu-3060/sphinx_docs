<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>05 インデックスバッファーと描画モード</title>
<style>
  body { margin: 16px; font-family: sans-serif; background: #f4f4f4; color: #222; }
  canvas { display: block; background: #000; max-width: 100%; }
  #error { color: #b00; white-space: pre-wrap; }
  .controls { margin: 8px 0; }
</style>
</head>
<body>
<h1>05 インデックスバッファーと描画モード</h1>
<p>4 つの頂点とインデックスバッファーを使って四角形を描画します。同じ頂点データを、描画モードを変えて表示できます。</p>
<pre id="error" hidden></pre>
<canvas id="canvas" width="640" height="480"></canvas>
<div class="controls">
  描画モード:
  <label><input type="radio" name="mode" value="triangles" checked> TRIANGLES（塗りつぶし）</label>
  <label><input type="radio" name="mode" value="lines"> LINES（線）</label>
  <label><input type="radio" name="mode" value="points"> POINTS（点）</label>
</div>

<script>
"use strict";

// ---- シェーダー ----
const VERTEX_SHADER_SOURCE = `#version 300 es
layout(location = 0) in vec2 a_position;
layout(location = 1) in vec3 a_color;

out vec3 v_color;

void main() {
  v_color = a_color;
  gl_Position = vec4(a_position, 0.0, 1.0);
  // POINTS で描画するときの点の大きさ（ピクセル）
  gl_PointSize = 16.0;
}
`;

const FRAGMENT_SHADER_SOURCE = `#version 300 es
precision mediump float;

in vec3 v_color;
out vec4 outColor;

void main() {
  outColor = vec4(v_color, 1.0);
}
`;

// ---- 共通の補助関数 ----
function showError(message) {
  const element = document.getElementById("error");
  element.textContent += message + "\n";
  element.hidden = false;
}

function createShader(gl, type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(shader);
    gl.deleteShader(shader);
    throw new Error("シェーダーのコンパイルに失敗しました。\n" + log);
  }
  return shader;
}

function createProgram(gl, vertexSource, fragmentSource) {
  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentSource);
  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);
  gl.deleteShader(vertexShader);
  gl.deleteShader(fragmentShader);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    const log = gl.getProgramInfoLog(program);
    gl.deleteProgram(program);
    throw new Error("プログラムのリンクに失敗しました。\n" + log);
  }
  return program;
}

// ---- メイン処理 ----
function main() {
  const canvas = document.getElementById("canvas");
  const gl = canvas.getContext("webgl2");
  if (!gl) {
    showError("このブラウザーは WebGL 2.0 に対応していません。");
    canvas.hidden = true;
    return;
  }

  const program = createProgram(gl, VERTEX_SHADER_SOURCE, FRAGMENT_SHADER_SOURCE);

  // 四角形の 4 つの頂点（x, y, r, g, b）
  //   3 ---- 2
  //   |    / |
  //   |  /   |
  //   0 ---- 1
  const vertices = new Float32Array([
    -0.6, -0.6,  1.0, 0.3, 0.3,  // 0: 左下
     0.6, -0.6,  0.3, 1.0, 0.3,  // 1: 右下
     0.6,  0.6,  0.3, 0.3, 1.0,  // 2: 右上
    -0.6,  0.6,  1.0, 1.0, 0.3,  // 3: 左上
  ]);

  // インデックス: 先頭 6 個が TRIANGLES 用、続く 10 個が LINES 用
  const indices = new Uint16Array([
    0, 1, 2,  0, 2, 3,                   // 三角形 2 つ（どちらも反時計回り）
    0, 1,  1, 2,  2, 3,  3, 0,  0, 2,    // 線分 5 本
  ]);

  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);

  const vertexBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
  const stride = 5 * Float32Array.BYTES_PER_ELEMENT;
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, stride, 0);
  gl.enableVertexAttribArray(1);
  gl.vertexAttribPointer(1, 3, gl.FLOAT, false, stride, 2 * Float32Array.BYTES_PER_ELEMENT);

  // ELEMENT_ARRAY_BUFFER のバインドは VAO に記録されるので、VAO をバインドした状態で行う
  const indexBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indices, gl.STATIC_DRAW);

  gl.bindVertexArray(null);

  const INDEX_SIZE = Uint16Array.BYTES_PER_ELEMENT;  // 2 バイト

  function render() {
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0.1, 0.1, 0.1, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT);

    gl.useProgram(program);
    gl.bindVertexArray(vao);
    const mode = document.querySelector("input[name=mode]:checked").value;
    if (mode === "triangles") {
      // インデックスの 0 番目から 6 個を使って三角形を描く
      gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
    } else if (mode === "lines") {
      // オフセットはバイト単位で指定する（6 個 × 2 バイト = 12 バイト目から）
      gl.drawElements(gl.LINES, 10, gl.UNSIGNED_SHORT, 6 * INDEX_SIZE);
    } else {
      // インデックスを使わずに、頂点を先頭から 4 個描く
      gl.drawArrays(gl.POINTS, 0, 4);
    }
    gl.bindVertexArray(null);
  }

  render();
  for (const radio of document.querySelectorAll("input[name=mode]")) {
    radio.addEventListener("change", render);
  }
}

try {
  main();
} catch (error) {
  showError(error.message);
}
</script>
</body>
</html>
