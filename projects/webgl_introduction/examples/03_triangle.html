<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>03 三角形の描画</title>
<style>
  body { margin: 16px; font-family: sans-serif; background: #f4f4f4; color: #222; }
  canvas { display: block; background: #000; max-width: 100%; }
  #error { color: #b00; white-space: pre-wrap; }
  .controls { margin: 8px 0; }
</style>
</head>
<body>
<h1>03 三角形の描画</h1>
<p>頂点シェーダーとフラグメントシェーダーを使って、1 つの三角形を描画します。</p>
<pre id="error" hidden></pre>
<canvas id="canvas" width="640" height="480"></canvas>
<div class="controls">
  <label>色: <input type="color" id="color" value="#ff8030"></label>
</div>

<script>
"use strict";

// ---- シェーダー ----
// 「#version 300 es」は必ずソースの 1 行目に書く（前に空行や空白を入れない）
const VERTEX_SHADER_SOURCE = `#version 300 es
// 頂点属性: バッファーから頂点ごとに 1 つずつ値を受け取る
layout(location = 0) in vec2 a_position;

void main() {
  // gl_Position にクリップ座標を書き込む
  gl_Position = vec4(a_position, 0.0, 1.0);
}
`;

const FRAGMENT_SHADER_SOURCE = `#version 300 es
// フラグメントシェーダーでは float の精度の指定が必須
precision mediump float;

// uniform 変数: 1 回の描画の間、すべての頂点・フラグメントで同じ値
uniform vec4 u_color;

// 出力する色
out vec4 outColor;

void main() {
  outColor = u_color;
}
`;

// ---- 共通の補助関数 ----
function showError(message) {
  const element = document.getElementById("error");
  element.textContent += message + "\n";
  element.hidden = false;
}

// シェーダーを作成してコンパイルする
function createShader(gl, type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(shader);
    gl.deleteShader(shader);
    throw new Error("シェーダーのコンパイルに失敗しました。\n" + log);
  }
  return shader;
}

// 頂点シェーダーとフラグメントシェーダーをリンクしてプログラムを作る
function createProgram(gl, vertexSource, fragmentSource) {
  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentSource);
  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);
  // リンク後はシェーダーオブジェクトを削除してよい
  gl.deleteShader(vertexShader);
  gl.deleteShader(fragmentShader);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    const log = gl.getProgramInfoLog(program);
    gl.deleteProgram(program);
    throw new Error("プログラムのリンクに失敗しました。\n" + log);
  }
  return program;
}

// "#rrggbb" 形式の文字列を 0 から 1 の RGB の配列に変換する
function parseColor(hex) {
  return [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255);
}

// ---- メイン処理 ----
function main() {
  const canvas = document.getElementById("canvas");
  const gl = canvas.getContext("webgl2");
  if (!gl) {
    showError("このブラウザーは WebGL 2.0 に対応していません。");
    canvas.hidden = true;
    return;
  }

  // 1. シェーダープログラムを作る
  const program = createProgram(gl, VERTEX_SHADER_SOURCE, FRAGMENT_SHADER_SOURCE);
  const colorLocation = gl.getUniformLocation(program, "u_color");

  // 2. 頂点データ（クリップ座標の x, y）をバッファーに転送する
  const positions = new Float32Array([
     0.0,  0.6,  // 上
    -0.6, -0.5,  // 左下
     0.6, -0.5,  // 右下
  ]);
  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

  // 3. VAO に頂点属性の読み出し方を記録する
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  gl.enableVertexAttribArray(0);  // location = 0 の a_position を有効にする
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);  // float を 2 個ずつ読む
  gl.bindVertexArray(null);

  // 4. 描画する
  function render() {
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0.1, 0.1, 0.1, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT);

    gl.useProgram(program);
    const [r, g, b] = parseColor(document.getElementById("color").value);
    gl.uniform4f(colorLocation, r, g, b, 1.0);

    gl.bindVertexArray(vao);
    gl.drawArrays(gl.TRIANGLES, 0, 3);  // 頂点 0 番から 3 個を三角形として描画
    gl.bindVertexArray(null);
  }

  render();
  // 色が変わったときだけ描画し直す（アニメーションしないので描画ループは不要）
  document.getElementById("color").addEventListener("input", render);
}

try {
  main();
} catch (error) {
  showError(error.message);
}
</script>
</body>
</html>
