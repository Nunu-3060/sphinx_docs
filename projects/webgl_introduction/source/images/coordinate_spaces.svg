<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230" font-family="sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="760" height="230" fill="#ffffff"/>
  <!-- row 1 -->
  <rect x="10" y="30" width="130" height="50" rx="6" fill="#dde8f5" stroke="#5a7fa8"/>
  <text x="75" y="60" text-anchor="middle">モデル座標</text>
  <rect x="280" y="30" width="130" height="50" rx="6" fill="#dde8f5" stroke="#5a7fa8"/>
  <text x="345" y="60" text-anchor="middle">ワールド座標</text>
  <rect x="550" y="30" width="130" height="50" rx="6" fill="#dde8f5" stroke="#5a7fa8"/>
  <text x="615" y="60" text-anchor="middle">ビュー座標</text>
  <line x1="140" y1="55" x2="278" y2="55" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="209" y="45" text-anchor="middle" font-size="13" fill="#a05a00">モデル行列</text>
  <line x1="410" y1="55" x2="548" y2="55" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="479" y="45" text-anchor="middle" font-size="13" fill="#a05a00">ビュー行列</text>
  <!-- down -->
  <path d="M615,80 L615,110 L75,110 L75,138" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="345" y="104" text-anchor="middle" font-size="13" fill="#a05a00">投影行列</text>
  <!-- row 2 -->
  <rect x="10" y="140" width="130" height="50" rx="6" fill="#ffe2b8" stroke="#d08a20"/>
  <text x="75" y="162" text-anchor="middle">クリップ座標</text>
  <text x="75" y="180" text-anchor="middle" font-size="11">（gl_Position）</text>
  <rect x="280" y="140" width="130" height="50" rx="6" fill="#eeeeee" stroke="#888"/>
  <text x="345" y="162" text-anchor="middle">正規化デバイス</text>
  <text x="345" y="180" text-anchor="middle">座標（NDC）</text>
  <rect x="550" y="140" width="130" height="50" rx="6" fill="#eeeeee" stroke="#888"/>
  <text x="615" y="162" text-anchor="middle">ウィンドウ座標</text>
  <text x="615" y="180" text-anchor="middle" font-size="11">（ピクセル）</text>
  <line x1="140" y1="165" x2="278" y2="165" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="209" y="155" text-anchor="middle" font-size="13" fill="#2a5a8a">w で割る</text>
  <line x1="410" y1="165" x2="548" y2="165" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="479" y="155" text-anchor="middle" font-size="13" fill="#2a5a8a">ビューポート変換</text>
  <!-- legend -->
  <text x="10" y="18" font-size="12">茶色の変換: 頂点シェーダーで行う（行列は JavaScript で用意）　青色の変換: GPU が自動的に行う</text>
  <text x="10" y="218" font-size="12">モデル行列・ビュー行列・投影行列を掛け合わせたものを、モデルビュー投影行列と呼ぶ</text>
</svg>
