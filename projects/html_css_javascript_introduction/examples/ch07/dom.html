<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DOM 操作の例</title>
  <style>
    .highlight {
      background-color: gold;
    }
  </style>
  <script src="dom.js" defer></script>
</head>
<body>
  <h1 id="title">DOM 操作の例</h1>

  <ul id="fruit-list">
    <li class="fruit">りんご</li>
    <li class="fruit">バナナ</li>
  </ul>

  <p>
    <a id="link" href="https://example.com/">example.com へのリンク</a>
  </p>

  <p>
    <button id="add-button" type="button">果物を追加</button>
    <button id="toggle-button" type="button">強調の切り替え</button>
    <button id="remove-button" type="button">最後の果物を削除</button>
  </p>
</body>
</html>
