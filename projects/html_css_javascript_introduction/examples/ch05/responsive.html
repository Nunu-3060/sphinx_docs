<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- この指定がないと、スマートフォンでは PC 向けの幅で縮小表示される -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>レスポンシブデザインの例</title>
  <style>
    /* CSS 変数 (カスタムプロパティ) の定義 */
    :root {
      --main-color: steelblue;
      --gap: 16px;
    }

    body {
      margin: 0;
      font-family: sans-serif;
    }

    header {
      padding: var(--gap);
      color: white;
      background-color: var(--main-color);
    }

    /* 狭い画面 (スマートフォン) 向けの指定を基本とする: 1 列 */
    .cards {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--gap);
      padding: var(--gap);
    }

    .card {
      padding: var(--gap);
      border: 2px solid var(--main-color);
      border-radius: 8px;
      /* transition: 変化を 0.3 秒かけて滑らかにする */
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 4px 12px rgb(0 0 0 / 20%);
    }

    /* 画面幅が 600px 以上: 2 列 */
    @media (min-width: 600px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* 画面幅が 900px 以上: 3 列 */
    @media (min-width: 900px) {
      .cards {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* animation: キーフレームで定義した動きを繰り返す */
    @keyframes blink {
      from { opacity: 1; }
      to   { opacity: 0.3; }
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      color: white;
      background-color: crimson;
      border-radius: 4px;
      animation: blink 1s ease-in-out infinite alternate;
    }
  </style>
</head>
<body>
  <header>
    <h1>レスポンシブデザインの例 <span class="badge">NEW</span></h1>
    <p>ブラウザの幅を変えると、カードの列数が 1 列・2 列・3 列と変わる。</p>
  </header>

  <div class="cards">
    <div class="card">カード 1</div>
    <div class="card">カード 2</div>
    <div class="card">カード 3</div>
    <div class="card">カード 4</div>
    <div class="card">カード 5</div>
    <div class="card">カード 6</div>
  </div>
</body>
</html>
