# Settings for flake8 and mypy. Run them in the examples folder:
#   python -m flake8 .
#   python -m mypy .

[flake8]
max-line-length = 120
exclude = __pycache__

[mypy]
strict = True

# mpl_toolkits (3D graphs of matplotlib) does not ship type hints.
# Ignore import errors for it.
[mypy-mpl_toolkits.*]
ignore_missing_imports = True
