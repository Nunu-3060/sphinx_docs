<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" width="640" height="350" font-family="sans-serif" font-size="14">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="350" fill="#ffffff"/>
  <!-- start -->
  <circle cx="110" cy="62" r="7" fill="#333333"/>
  <path d="M110,70 L110,140" stroke="#333333" fill="none" marker-end="url(#a)"/>
  <text x="118" y="108" font-size="12">起動</text>
  <!-- states -->
  <ellipse cx="110" cy="170" rx="62" ry="28" fill="#eef4fb" stroke="#4a78b0" stroke-width="1.5"/>
  <text x="110" y="175" text-anchor="middle">フォロワー</text>
  <ellipse cx="320" cy="170" rx="62" ry="28" fill="#fbf1e6" stroke="#b07a3a" stroke-width="1.5"/>
  <text x="320" y="175" text-anchor="middle">候補者</text>
  <ellipse cx="530" cy="170" rx="62" ry="28" fill="#e9f5ea" stroke="#4a9050" stroke-width="1.5"/>
  <text x="530" y="175" text-anchor="middle">リーダー</text>
  <!-- follower -> candidate -->
  <path d="M160,153 Q215,118 266,153" stroke="#333333" fill="none" marker-end="url(#a)"/>
  <text x="213" y="112" text-anchor="middle" font-size="12">選挙タイムアウト</text>
  <!-- candidate self loop -->
  <path d="M298,144 C280,80 360,80 342,144" stroke="#333333" fill="none" marker-end="url(#a)"/>
  <text x="320" y="62" text-anchor="middle" font-size="12">タイムアウト（票が割れた）</text>
  <text x="320" y="78" text-anchor="middle" font-size="12">→ term を増やして再選挙</text>
  <!-- candidate -> leader -->
  <path d="M374,153 Q427,118 478,153" stroke="#333333" fill="none" marker-end="url(#a)"/>
  <text x="427" y="112" text-anchor="middle" font-size="12">過半数の票を得る</text>
  <!-- candidate -> follower -->
  <path d="M266,187 Q215,222 160,187" stroke="#333333" fill="none" marker-end="url(#a)"/>
  <text x="228" y="232" text-anchor="middle" font-size="12">リーダーを発見、または</text>
  <text x="228" y="248" text-anchor="middle" font-size="12">より大きな term を知る</text>
  <!-- leader -> follower -->
  <path d="M530,198 C530,330 90,330 92,197" stroke="#333333" fill="none" marker-end="url(#a)"/>
  <text x="320" y="318" text-anchor="middle" font-size="12">より大きな term を知る</text>
  <!-- leader note -->
  <text x="560" y="106" text-anchor="middle" font-size="12">ハートビートを</text>
  <text x="560" y="122" text-anchor="middle" font-size="12">定期的に送信</text>
</svg>
