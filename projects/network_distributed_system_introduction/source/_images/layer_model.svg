<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="sans-serif" font-size="13">
  <rect x="0" y="0" width="640" height="360" fill="#ffffff"/>
  <!-- column titles -->
  <text x="110" y="32" text-anchor="middle" font-size="14" font-weight="bold">OSI 参照モデル</text>
  <text x="305" y="32" text-anchor="middle" font-size="14" font-weight="bold">TCP/IP モデル</text>
  <text x="520" y="32" text-anchor="middle" font-size="14" font-weight="bold">代表的なプロトコル</text>
  <!-- OSI 7 layers -->
  <g fill="#eef4fb" stroke="#4a78b0">
    <rect x="20" y="50" width="180" height="40"/>
    <rect x="20" y="90" width="180" height="40"/>
    <rect x="20" y="130" width="180" height="40"/>
    <rect x="20" y="170" width="180" height="40"/>
    <rect x="20" y="210" width="180" height="40"/>
    <rect x="20" y="250" width="180" height="40"/>
    <rect x="20" y="290" width="180" height="40"/>
  </g>
  <text x="34" y="75">7  アプリケーション層</text>
  <text x="34" y="115">6  プレゼンテーション層</text>
  <text x="34" y="155">5  セッション層</text>
  <text x="34" y="195">4  トランスポート層</text>
  <text x="34" y="235">3  ネットワーク層</text>
  <text x="34" y="275">2  データリンク層</text>
  <text x="34" y="315">1  物理層</text>
  <!-- TCP/IP 4 layers -->
  <rect x="220" y="50" width="170" height="120" fill="#fbf1e6" stroke="#b07a3a"/>
  <rect x="220" y="170" width="170" height="40" fill="#eaf5ea" stroke="#4a8a4a"/>
  <rect x="220" y="210" width="170" height="40" fill="#f3eefb" stroke="#7a5ab0"/>
  <rect x="220" y="250" width="170" height="80" fill="#ececec" stroke="#666666"/>
  <text x="305" y="115" text-anchor="middle">アプリケーション層</text>
  <text x="305" y="195" text-anchor="middle">トランスポート層</text>
  <text x="305" y="235" text-anchor="middle">インターネット層</text>
  <text x="305" y="295" text-anchor="middle">リンク層</text>
  <!-- protocols -->
  <rect x="410" y="50" width="220" height="120" fill="#ffffff" stroke="#b07a3a" stroke-dasharray="5 3"/>
  <rect x="410" y="170" width="220" height="40" fill="#ffffff" stroke="#4a8a4a" stroke-dasharray="5 3"/>
  <rect x="410" y="210" width="220" height="40" fill="#ffffff" stroke="#7a5ab0" stroke-dasharray="5 3"/>
  <rect x="410" y="250" width="220" height="80" fill="#ffffff" stroke="#666666" stroke-dasharray="5 3"/>
  <text x="520" y="105" text-anchor="middle">HTTP、DNS、SMTP、SSH</text>
  <text x="520" y="127" text-anchor="middle">TLS など</text>
  <text x="520" y="195" text-anchor="middle">TCP、UDP、QUIC</text>
  <text x="520" y="235" text-anchor="middle">IPv4、IPv6、ICMP</text>
  <text x="520" y="285" text-anchor="middle">Ethernet、Wi-Fi、ARP</text>
  <text x="520" y="307" text-anchor="middle">（ケーブル、光、電波）</text>
  <text x="320" y="352" text-anchor="middle" font-size="12" fill="#555555">横に並んだ層がおおよそ対応します（境界は厳密には一致しません）</text>
</svg>
