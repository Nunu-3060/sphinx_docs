<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 570" width="640" height="570" font-family="sans-serif" font-size="14">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="570" fill="#ffffff"/>
  <!-- boxes -->
  <rect x="20" y="160" width="130" height="80" rx="6" fill="#ececec" stroke="#666666"/>
  <text x="85" y="196" text-anchor="middle">スタブリゾルバー</text>
  <text x="85" y="216" text-anchor="middle" font-size="12">（クライアントの OS）</text>
  <rect x="232" y="160" width="156" height="80" rx="6" fill="#eef4fb" stroke="#4a78b0"/>
  <text x="310" y="196" text-anchor="middle">フルリゾルバー</text>
  <text x="310" y="216" text-anchor="middle" font-size="12">（キャッシュを持つ）</text>
  <rect x="480" y="40" width="150" height="60" rx="6" fill="#e9f5ea" stroke="#4a9050"/>
  <text x="555" y="66" text-anchor="middle">ルートサーバー</text>
  <text x="555" y="86" text-anchor="middle" font-size="12">（.）</text>
  <rect x="480" y="160" width="150" height="80" rx="6" fill="#e9f5ea" stroke="#4a9050"/>
  <text x="555" y="196" text-anchor="middle">TLD のサーバー</text>
  <text x="555" y="216" text-anchor="middle" font-size="12">（com.）</text>
  <rect x="480" y="300" width="150" height="60" rx="6" fill="#fbf1e6" stroke="#b07a3a"/>
  <text x="555" y="326" text-anchor="middle">権威サーバー</text>
  <text x="555" y="346" text-anchor="middle" font-size="12">（example.com.）</text>
  <!-- stub <-> full -->
  <path d="M150,190 L230,190" stroke="#333333" fill="none" marker-end="url(#a)"/>
  <path d="M232,210 L152,210" stroke="#333333" fill="none" marker-end="url(#a)"/>
  <!-- full <-> root -->
  <path d="M380,160 L478,81" stroke="#333333" fill="none" marker-end="url(#a)"/>
  <path d="M480,94 L390,168" stroke="#333333" fill="none" marker-end="url(#a)"/>
  <!-- full <-> TLD -->
  <path d="M388,190 L478,190" stroke="#333333" fill="none" marker-end="url(#a)"/>
  <path d="M480,210 L390,210" stroke="#333333" fill="none" marker-end="url(#a)"/>
  <!-- full <-> authoritative -->
  <path d="M388,230 L478,305" stroke="#333333" fill="none" marker-end="url(#a)"/>
  <path d="M480,320 L382,241" stroke="#333333" fill="none" marker-end="url(#a)"/>
  <!-- step numbers -->
  <g font-size="11" text-anchor="middle">
    <circle cx="191" cy="177" r="9" fill="#ffffff" stroke="#333333"/>
    <text x="191" y="181">1</text>
    <circle cx="421" cy="109" r="9" fill="#ffffff" stroke="#333333"/>
    <text x="421" y="113">2</text>
    <circle cx="443" cy="143" r="9" fill="#ffffff" stroke="#333333"/>
    <text x="443" y="147">3</text>
    <circle cx="434" cy="177" r="9" fill="#ffffff" stroke="#333333"/>
    <text x="434" y="181">4</text>
    <circle cx="434" cy="223" r="9" fill="#ffffff" stroke="#333333"/>
    <text x="434" y="227">5</text>
    <circle cx="443" cy="257" r="9" fill="#ffffff" stroke="#333333"/>
    <text x="443" y="261">6</text>
    <circle cx="421" cy="291" r="9" fill="#ffffff" stroke="#333333"/>
    <text x="421" y="295">7</text>
    <circle cx="191" cy="223" r="9" fill="#ffffff" stroke="#333333"/>
    <text x="191" y="227">8</text>
  </g>
  <!-- region labels -->
  <text x="191" y="148" text-anchor="middle" font-size="12" fill="#4a78b0">再帰問い合わせ</text>
  <text x="310" y="266" text-anchor="middle" font-size="12" fill="#4a9050">反復問い合わせ（2〜7）</text>
  <!-- legend -->
  <line x1="20" y1="385" x2="620" y2="385" stroke="#cccccc"/>
  <g font-size="13">
    <text x="30" y="410">1. www.example.com の A レコードを問い合わせる（「答えを調べてほしい」）</text>
    <text x="30" y="430">2. ルートサーバーに www.example.com の A レコードを問い合わせる</text>
    <text x="30" y="450">3. 答えの代わりに、com. を担当するサーバー（NS レコード）を紹介される</text>
    <text x="30" y="470">4. com. の TLD のサーバーに同じ質問をする</text>
    <text x="30" y="490">5. 答えの代わりに、example.com. を担当するサーバーを紹介される</text>
    <text x="30" y="510">6. example.com. の権威サーバーに同じ質問をする</text>
    <text x="30" y="530">7. 答え（A レコードの IP アドレスと TTL）が返る</text>
    <text x="30" y="550">8. フルリゾルバーは答えをキャッシュに保存し、スタブリゾルバーに返す</text>
  </g>
</svg>
