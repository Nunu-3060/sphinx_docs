<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="sans-serif" font-size="12">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="360" fill="#ffffff"/>
  <!-- process lines -->
  <text x="30" y="95" text-anchor="middle" font-size="14" font-weight="bold">P1</text>
  <text x="30" y="195" text-anchor="middle" font-size="14" font-weight="bold">P2</text>
  <text x="30" y="295" text-anchor="middle" font-size="14" font-weight="bold">P3</text>
  <line x1="60" y1="90" x2="600" y2="90" stroke="#666666" stroke-width="2"/>
  <line x1="60" y1="190" x2="600" y2="190" stroke="#666666" stroke-width="2"/>
  <line x1="60" y1="290" x2="600" y2="290" stroke="#666666" stroke-width="2"/>
  <!-- messages -->
  <line x1="175" y1="90" x2="227" y2="184" stroke="#b07a3a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="210" y="135" fill="#b07a3a">m1</text>
  <line x1="220" y1="290" x2="337" y2="96" stroke="#b07a3a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="258" y="245" fill="#b07a3a">m3</text>
  <line x1="420" y1="190" x2="496" y2="284" stroke="#b07a3a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="470" y="235" fill="#b07a3a">m2</text>
  <!-- P1 events -->
  <circle cx="90" cy="90" r="5" fill="#4a78b0"/>
  <text x="90" y="72" text-anchor="middle">a1 [1,0,0]</text>
  <circle cx="175" cy="90" r="5" fill="#4a78b0"/>
  <text x="175" y="72" text-anchor="middle">a2 [2,0,0]</text>
  <circle cx="340" cy="90" r="5" fill="#4a78b0"/>
  <text x="340" y="72" text-anchor="middle">a3 [3,0,2]</text>
  <circle cx="480" cy="90" r="5" fill="#4a78b0"/>
  <text x="480" y="72" text-anchor="middle">a4 [4,0,2]</text>
  <!-- P2 events -->
  <circle cx="120" cy="190" r="5" fill="#4a78b0"/>
  <text x="120" y="172" text-anchor="middle">b1 [0,1,0]</text>
  <circle cx="230" cy="190" r="5" fill="#4a78b0"/>
  <text x="224" y="210" text-anchor="end">b2 [2,2,0]</text>
  <circle cx="420" cy="190" r="5" fill="#4a78b0"/>
  <text x="420" y="172" text-anchor="middle">b3 [2,3,0]</text>
  <!-- P3 events -->
  <circle cx="110" cy="290" r="5" fill="#4a78b0"/>
  <text x="110" y="312" text-anchor="middle">c1 [0,0,1]</text>
  <circle cx="220" cy="290" r="5" fill="#4a78b0"/>
  <text x="220" y="312" text-anchor="middle">c2 [0,0,2]</text>
  <circle cx="500" cy="290" r="5" fill="#4a78b0"/>
  <text x="500" y="312" text-anchor="middle">c3 [2,3,3]</text>
  <!-- time axis -->
  <line x1="60" y1="340" x2="590" y2="340" stroke="#333333" marker-end="url(#a)"/>
  <text x="598" y="344">時間</text>
</svg>
