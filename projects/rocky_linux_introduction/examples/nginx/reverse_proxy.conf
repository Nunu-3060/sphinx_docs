# ------------------------------------------------------------
# reverse_proxy.conf - nginx をリバースプロキシとして使う設定例
#
# 第 17 章で使用します。/etc/nginx/conf.d/ に配置します。
# http://app.example.com/ へのアクセスを、同じサーバーの
# 127.0.0.1:8000 で待ち受けるアプリケーションへ転送します。
#
# SELinux が有効な環境では、nginx から他のポートへの接続を許可する必要があります。
#   sudo setsebool -P httpd_can_network_connect on
# ------------------------------------------------------------
upstream app_backend {
    server 127.0.0.1:8000;
}

server {
    listen       80;
    listen       [::]:80;
    server_name  app.example.com;

    access_log   /var/log/nginx/app.access.log;
    error_log    /var/log/nginx/app.error.log;

    server_tokens off;

    location / {
        proxy_pass http://app_backend;

        # 転送先のアプリケーションに、元のリクエストの情報を伝える
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 転送先の応答を待つ時間
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
