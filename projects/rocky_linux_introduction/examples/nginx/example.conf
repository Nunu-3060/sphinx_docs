# ------------------------------------------------------------
# example.conf - 静的コンテンツを配信する nginx の設定例
#
# 第 17 章で使用します。/etc/nginx/conf.d/ に配置します。
# server_name は実際のホスト名に変更してください。
# ------------------------------------------------------------
server {
    listen       80;
    listen       [::]:80;
    server_name  www.example.com;

    # コンテンツの配置場所
    root         /srv/www/example;
    index        index.html;

    # アクセスログとエラーログ
    access_log   /var/log/nginx/example.access.log;
    error_log    /var/log/nginx/example.error.log;

    # レスポンスヘッダーに nginx のバージョンを出さない
    server_tokens off;

    location / {
        try_files $uri $uri/ =404;
    }
}
