# 文書の分類（グループ）と、GitHub Pages 公開用の出力先の対応表。
#
# * make_pages_site.py は、グループごとに
#   <output_root>/sphinx_docs_<folder>/docs/ へビルド結果と文書一覧を出力する。
# * make_readme.py は、readme.md の文書一覧をこのグループごとに作る。
# * make_docs_index.py は、docs/index.html に各グループの公開先へのリンクを並べる。
# * projects の文書は、どれか 1 つのグループに必ず 1 回だけ書く
#   （漏れ・重複・存在しない名前があると、上記のスクリプトはエラーで終了する）。
# * グループと文書の並び順は、文書一覧の並び順になる。

# 出力先の親フォルダー（このファイルのあるフォルダーからの相対パス）
output_root = ".."

# GitHub Pages の公開先 URL の共通部分。
# グループの公開先 URL は <pages_base_url>sphinx_docs_<folder>/ になる。
pages_base_url = "https://nunu-3060.github.io/"

