# Settings for flake8 and mypy. Run them in the examples folder:
#   python -m flake8 .
#   python -m mypy py

[flake8]
max-line-length = 79
exclude = __pycache__

[mypy]
strict = True
# Functions in matplotlib.dates have no type hints. Allow calling them.
untyped_calls_exclude = matplotlib.dates

# The graphviz package does not ship type hints. Ignore import errors for it.
[mypy-graphviz.*]
ignore_missing_imports = True
