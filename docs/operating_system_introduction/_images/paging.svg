<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" font-family="sans-serif" font-size="14">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a9050"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="600" height="300" fill="#ffffff"/>
  <!-- offset is copied as is -->
  <path d="M190,70 L190,36 L510,36 L510,68" stroke="#4a9050" fill="none" stroke-dasharray="5 3" marker-end="url(#g)"/>
  <text x="350" y="28" text-anchor="middle" font-size="12" fill="#2f6a35">オフセットはそのまま使う</text>
  <!-- virtual address -->
  <text x="20" y="62">仮想アドレス</text>
  <rect x="20" y="70" width="120" height="36" fill="#eef4fb" stroke="#4a78b0"/>
  <text x="80" y="93" text-anchor="middle">ページ番号</text>
  <rect x="140" y="70" width="100" height="36" fill="#e9f5ea" stroke="#4a9050"/>
  <text x="190" y="93" text-anchor="middle">オフセット</text>
  <!-- physical address -->
  <text x="340" y="62">物理アドレス</text>
  <rect x="340" y="70" width="120" height="36" fill="#fbf1e6" stroke="#b07a3a"/>
  <text x="400" y="93" text-anchor="middle">フレーム番号</text>
  <rect x="460" y="70" width="100" height="36" fill="#e9f5ea" stroke="#4a9050"/>
  <text x="510" y="93" text-anchor="middle">オフセット</text>
  <!-- page table -->
  <text x="40" y="160">ページテーブル（ページ番号が 1 の場合）</text>
  <rect x="40" y="170" width="140" height="28" fill="#ffffff" stroke="#666666"/>
  <text x="110" y="189" text-anchor="middle" font-size="12">0 → フレーム 5</text>
  <rect x="40" y="198" width="140" height="28" fill="#fbf1e6" stroke="#b07a3a"/>
  <text x="110" y="217" text-anchor="middle" font-size="12">1 → フレーム 2</text>
  <rect x="40" y="226" width="140" height="28" fill="#ffffff" stroke="#666666"/>
  <text x="110" y="245" text-anchor="middle" font-size="12">2 → フレーム 7</text>
  <rect x="40" y="254" width="140" height="28" fill="#ffffff" stroke="#666666"/>
  <text x="110" y="273" text-anchor="middle" font-size="12">3 → （なし）</text>
  <!-- lookup arrows -->
  <path d="M80,106 L80,124 L20,124 L20,212 L38,212" stroke="#333333" fill="none" marker-end="url(#a)"/>
  <path d="M180,212 L400,212 L400,108" stroke="#333333" fill="none" marker-end="url(#a)"/>
  <text x="290" y="204" text-anchor="middle" font-size="12">MMU が変換する</text>
</svg>
