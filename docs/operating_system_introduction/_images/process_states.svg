<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" font-family="sans-serif" font-size="14">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="560" height="300" fill="#ffffff"/>
  <!-- states -->
  <ellipse cx="70" cy="60" rx="50" ry="24" fill="#ececec" stroke="#666666"/>
  <text x="70" y="65" text-anchor="middle">生成</text>
  <ellipse cx="200" cy="140" rx="60" ry="26" fill="#eef4fb" stroke="#4a78b0"/>
  <text x="200" y="145" text-anchor="middle">実行可能</text>
  <ellipse cx="400" cy="140" rx="60" ry="26" fill="#e9f5ea" stroke="#4a9050"/>
  <text x="400" y="145" text-anchor="middle">実行中</text>
  <ellipse cx="300" cy="255" rx="60" ry="26" fill="#fbf1e6" stroke="#b07a3a"/>
  <text x="300" y="260" text-anchor="middle">待ち</text>
  <ellipse cx="500" cy="60" rx="50" ry="24" fill="#ececec" stroke="#666666"/>
  <text x="500" y="65" text-anchor="middle">終了</text>
  <!-- transitions -->
  <path d="M105,77 L160,118" stroke="#333333" fill="none" marker-end="url(#a)"/>
  <text x="90" y="112" font-size="12">受け付け</text>
  <path d="M255,128 Q300,100 342,128" stroke="#333333" fill="none" marker-end="url(#a)"/>
  <text x="300" y="98" text-anchor="middle" font-size="12">CPU の割り当て</text>
  <path d="M342,152 Q300,180 258,152" stroke="#333333" fill="none" marker-end="url(#a)"/>
  <text x="300" y="192" text-anchor="middle" font-size="12">横取り</text>
  <path d="M420,165 L345,240" stroke="#333333" fill="none" marker-end="url(#a)"/>
  <text x="395" y="225" font-size="12">入出力などの待ち</text>
  <path d="M255,240 L190,168" stroke="#333333" fill="none" marker-end="url(#a)"/>
  <text x="120" y="225" font-size="12">待ちの完了</text>
  <path d="M435,120 L475,80" stroke="#333333" fill="none" marker-end="url(#a)"/>
  <text x="462" y="112" font-size="12">終了</text>
</svg>
