# GitHub Actions でテストを自動実行する設定の例。
# リポジトリの .github/workflows/test.yml に置くと、push と pull request のたびに実行される。
# この例は、pyproject.toml、setup.cfg、requirements-dev.txt があるフォルダーを
# リポジトリのルートとしている。
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m flake8 .
      - name: Type check
        run: python -m mypy .
      - name: Test with coverage
        run: |
          python -m coverage run -m pytest
          python -m coverage report --fail-under=90
