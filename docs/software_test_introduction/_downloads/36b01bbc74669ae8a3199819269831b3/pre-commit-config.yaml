# pre-commit の設定の例。リポジトリのルートに .pre-commit-config.yaml という名前で置き、
# python -m pre_commit install を実行すると、git commit のたびに検査が行われる。
# ここでは、インストール済みの flake8、mypy、pytest をそのまま使う local フックとしている。
repos:
  - repo: local
    hooks:
      - id: flake8
        name: flake8
        entry: python -m flake8
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: python -m mypy .
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: python -m pytest -q
        language: system
        types: [python]
        pass_filenames: false
