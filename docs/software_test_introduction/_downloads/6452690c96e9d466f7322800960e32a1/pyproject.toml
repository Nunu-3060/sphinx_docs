# pytest、mypy、coverage.py の設定。examples フォルダーで次のように実行する。
#   python -m pytest
#   python -m mypy .
#   python -m coverage run -m pytest
#   python -m coverage report
# flake8 は pyproject.toml を読まないため、flake8 の設定は setup.cfg に書く。

[tool.pytest.ini_options]
# examples フォルダーを import の起点にして、shop パッケージを読み込めるようにする
pythonpath = ["."]
# 引数なしで実行したときに、テストを探すフォルダー
testpaths = [
    "ch06_unittest",
    "ch07_pytest_basics",
    "ch08_pytest_advanced",
    "ch09_test_double",
    "ch10_testable_design",
    "ch11_integration",
    "ch12_techniques",
    "ch14_coverage",
    "ch15_tdd",
    "ch16_good_tests",
]
# 登録していないマーカーを誤記として扱う
addopts = ["--strict-markers"]
markers = ["slow: 実行に時間がかかるテスト"]

[tool.mypy]
strict = true
exclude = ['^\.venv/']  # 仮想環境のフォルダーは検査しない

[tool.coverage.run]
branch = true
source = ["shop"]
