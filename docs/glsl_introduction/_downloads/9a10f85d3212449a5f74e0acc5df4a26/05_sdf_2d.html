<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>05 距離関数による図形 | GLSL 入門</title>
<style>
  body { margin: 0; padding: 12px; background: #1e1e1e; color: #ddd; font-family: "Segoe UI", "Hiragino Sans", "Meiryo", sans-serif; font-size: 14px; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  canvas { display: block; width: 100%; max-width: 600px; height: auto; background: #000; touch-action: none; cursor: crosshair; }
  .controls { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  .controls input[type="range"] { width: 110px; vertical-align: middle; }
  #log { color: #ff8080; white-space: pre-wrap; margin: 8px 0 0; }
</style>
</head>
<body>
<h1>05 距離関数（SDF）による図形の合成</h1>
<canvas id="canvas" width="600" height="400"></canvas>
<div class="controls">
  <label>合成方法
    <select id="operation">
      <option value="0">和（min）</option>
      <option value="1">積（max）</option>
      <option value="2">差（max(a, -b)）</option>
      <option value="3" selected>なめらかな和（smoothMin）</option>
    </select>
  </label>
  <label>なめらかさ k <input id="smoothness" type="range" min="0.01" max="0.5" step="0.01" value="0.2"></label>
  <label><input id="show-field" type="checkbox" checked> 距離の値を等高線で表示</label>
  <span>キャンバスをドラッグすると円が動きます。</span>
</div>
<pre id="log"></pre>

<script id="vertex-shader" type="x-shader/x-vertex">
#version 300 es

const vec2 POSITIONS[3] = vec2[3](vec2(-1.0, -1.0), vec2(3.0, -1.0), vec2(-1.0, 3.0));

void main() {
    gl_Position = vec4(POSITIONS[gl_VertexID], 0.0, 1.0);
}
</script>

<script id="fragment-shader" type="x-shader/x-fragment">
#version 300 es
precision highp float;

uniform vec2 uResolution;
uniform vec2 uCirclePosition;  // 円の中心（p と同じ座標系）
uniform int uOperation;        // 0：和、1：積、2：差、3：なめらかな和
uniform float uSmoothness;     // なめらかな和の k
uniform bool uShowField;       // true のとき距離の値を等高線で表示する

out vec4 outColor;

// 円の距離関数：中心が原点、半径 r
float sdCircle(vec2 p, float r) {
    return length(p) - r;
}

// 長方形の距離関数：中心が原点、幅と高さの半分が b
float sdBox(vec2 p, vec2 b) {
    vec2 d = abs(p) - b;
    return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0);
}

// なめらかな和：a と b の境目を幅 k でなめらかにつなぐ
float smoothMin(float a, float b, float k) {
    float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
    return mix(b, a, h) - k * h * (1.0 - h);
}

void main() {
    vec2 p = (gl_FragCoord.xy * 2.0 - uResolution) / min(uResolution.x, uResolution.y);
    float pixel = 2.0 / min(uResolution.x, uResolution.y);

    float a = sdBox(p, vec2(0.45, 0.30));             // 長方形（中央に固定）
    float b = sdCircle(p - uCirclePosition, 0.35);    // 円（ドラッグで移動）

    float d;
    if (uOperation == 0) {
        d = min(a, b);                  // 和：どちらかの内側
    } else if (uOperation == 1) {
        d = max(a, b);                  // 積：両方の内側
    } else if (uOperation == 2) {
        d = max(a, -b);                 // 差：a の内側かつ b の外側
    } else {
        d = smoothMin(a, b, uSmoothness);
    }

    vec3 color;
    if (uShowField) {
        // 外側（d > 0）はオレンジ、内側（d < 0）は青。境界から離れるほど明るくする
        color = (d > 0.0) ? vec3(0.9, 0.6, 0.3) : vec3(0.4, 0.7, 0.9);
        color *= 1.0 - exp(-4.0 * abs(d));
        // 距離 0.1 ごとに等高線を引く
        color *= 0.8 + 0.2 * cos(2.0 * 3.14159265 * d / 0.1);
        // 境界（d = 0）を白い線で描く
        color = mix(color, vec3(1.0), 1.0 - smoothstep(0.0, 2.0 * pixel, abs(d)));
    } else {
        // 図形の内側を塗りつぶす（境界の 1 ピクセルをなめらかにする）
        float inside = 1.0 - smoothstep(-pixel, pixel, d);
        color = mix(vec3(0.12), vec3(1.0, 0.8, 0.3), inside);
    }

    outColor = vec4(color, 1.0);
}
</script>

<script>
"use strict";

function compileShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        const message = gl.getShaderInfoLog(shader);
        gl.deleteShader(shader);
        throw new Error("シェーダーのコンパイルに失敗しました。\n" + message);
    }
    return shader;
}

function createProgram(gl, vertexSource, fragmentSource) {
    const vertexShader = compileShader(gl, gl.VERTEX_SHADER, vertexSource);
    const fragmentShader = compileShader(gl, gl.FRAGMENT_SHADER, fragmentSource);
    const program = gl.createProgram();
    gl.attachShader(program, vertexShader);
    gl.attachShader(program, fragmentShader);
    gl.linkProgram(program);
    gl.deleteShader(vertexShader);
    gl.deleteShader(fragmentShader);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        throw new Error("プログラムのリンクに失敗しました。\n" + gl.getProgramInfoLog(program));
    }
    return program;
}

function getShaderSource(id) {
    return document.getElementById(id).textContent.trim();
}

function main() {
    const canvas = document.getElementById("canvas");
    const gl = canvas.getContext("webgl2");
    if (!gl) {
        throw new Error("このブラウザーは WebGL 2.0 に対応していません。");
    }
    const program = createProgram(gl, getShaderSource("vertex-shader"), getShaderSource("fragment-shader"));
    const locations = {
        resolution: gl.getUniformLocation(program, "uResolution"),
        circlePosition: gl.getUniformLocation(program, "uCirclePosition"),
        operation: gl.getUniformLocation(program, "uOperation"),
        smoothness: gl.getUniformLocation(program, "uSmoothness"),
        showField: gl.getUniformLocation(program, "uShowField"),
    };
    const vao = gl.createVertexArray();
    const input = (id) => document.getElementById(id);

    let circlePosition = [0.35, 0.2];

    function draw() {
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.useProgram(program);
        gl.uniform2f(locations.resolution, canvas.width, canvas.height);
        gl.uniform2f(locations.circlePosition, circlePosition[0], circlePosition[1]);
        gl.uniform1i(locations.operation, Number(input("operation").value));
        gl.uniform1f(locations.smoothness, Number(input("smoothness").value));
        gl.uniform1i(locations.showField, input("show-field").checked ? 1 : 0);
        gl.bindVertexArray(vao);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    // マウスの位置を、シェーダーの p と同じ座標系に変換する
    function updateCircle(event) {
        const rect = canvas.getBoundingClientRect();
        const x = (event.clientX - rect.left) / rect.width * canvas.width;
        const y = (rect.bottom - event.clientY) / rect.height * canvas.height;  // WebGL は下が y = 0
        const size = Math.min(canvas.width, canvas.height);
        circlePosition = [(2 * x - canvas.width) / size, (2 * y - canvas.height) / size];
        draw();
    }
    canvas.addEventListener("pointerdown", (event) => {
        canvas.setPointerCapture(event.pointerId);
        updateCircle(event);
    });
    canvas.addEventListener("pointermove", (event) => {
        if (event.buttons !== 0) {
            updateCircle(event);
        }
    });

    for (const id of ["operation", "smoothness", "show-field"]) {
        input(id).addEventListener("input", draw);
    }
    draw();
}

try {
    main();
} catch (error) {
    document.getElementById("log").textContent = error.message;
    console.error(error);
}
</script>
</body>
</html>
