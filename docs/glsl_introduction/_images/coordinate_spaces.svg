<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" font-family="Meiryo, 'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="760" height="250" fill="#ffffff"/>

  <!-- 1 段目：頂点シェーダーで行う変換 -->
  <rect x="10" y="10" width="740" height="100" rx="8" fill="#f2f7ff" stroke="#3a78c2" stroke-dasharray="6 4"/>
  <text x="20" y="30" font-size="12" fill="#3a78c2">頂点シェーダーで計算する（gl_Position に代入するまで）</text>

  <rect x="20" y="45" width="120" height="50" rx="6" fill="#fff" stroke="#888"/>
  <text x="80" y="75" text-anchor="middle">モデル座標</text>
  <rect x="220" y="45" width="120" height="50" rx="6" fill="#fff" stroke="#888"/>
  <text x="280" y="75" text-anchor="middle">ワールド座標</text>
  <rect x="420" y="45" width="120" height="50" rx="6" fill="#fff" stroke="#888"/>
  <text x="480" y="75" text-anchor="middle">ビュー座標</text>
  <rect x="620" y="45" width="120" height="50" rx="6" fill="#fff" stroke="#888"/>
  <text x="680" y="75" text-anchor="middle">クリップ座標</text>

  <line x1="140" y1="70" x2="218" y2="70" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="180" y="62" text-anchor="middle" font-size="12">モデル行列</text>
  <line x1="340" y1="70" x2="418" y2="70" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380" y="62" text-anchor="middle" font-size="12">ビュー行列</text>
  <line x1="540" y1="70" x2="618" y2="70" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="580" y="62" text-anchor="middle" font-size="12">射影行列</text>

  <!-- 2 段目：GPU が行う変換 -->
  <rect x="10" y="130" width="740" height="110" rx="8" fill="#f7f7f7" stroke="#888" stroke-dasharray="6 4"/>
  <text x="20" y="232" font-size="12" fill="#555">GPU が自動的に計算する</text>

  <path d="M680,95 L680,145 L480,145 L480,158" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="140" text-anchor="middle" font-size="12">w で割る</text>

  <rect x="400" y="160" width="160" height="50" rx="6" fill="#fff" stroke="#888"/>
  <text x="480" y="182" text-anchor="middle">正規化デバイス座標</text>
  <text x="480" y="200" text-anchor="middle" font-size="12" fill="#555">(NDC)</text>
  <rect x="160" y="160" width="140" height="50" rx="6" fill="#fff" stroke="#888"/>
  <text x="230" y="190" text-anchor="middle">ウィンドウ座標</text>
  <line x1="400" y1="185" x2="302" y2="185" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="351" y="175" text-anchor="middle" font-size="12">ビューポート変換</text>
</svg>
