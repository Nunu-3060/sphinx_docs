# ============================================================
# pre-commit の設定例
#   使うときはファイル名を .pre-commit-config.yaml に変更して、
#   リポジトリの最上位ディレクトリに置きます。
#   その後、次のコマンドでフックを有効にします。
#     pip install pre-commit
#     pre-commit install
#   rev は各リポジトリの最新のタグに置き換えてください。
# ============================================================
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace       # 行末の空白を削除する
      - id: end-of-file-fixer         # ファイル末尾の改行をそろえる
      - id: check-added-large-files   # 大きなファイルの追加を防ぐ
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff                      # Python コードの静的解析
      - id: ruff-format               # Python コードの整形
