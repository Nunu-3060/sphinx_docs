# Settings for flake8 and mypy. Run them in the examples folder:
#   python -m flake8 .
#   python -m mypy py
#
# Some samples import each other as a package (sample_app), so mypy is run
# on the py folder, not on each file.

[flake8]
max-line-length = 79
exclude = __pycache__,output

[mypy]
strict = True
exclude = /output/

# The graphviz package does not ship type hints. Ignore import errors for it.
[mypy-graphviz.*]
ignore_missing_imports = True
