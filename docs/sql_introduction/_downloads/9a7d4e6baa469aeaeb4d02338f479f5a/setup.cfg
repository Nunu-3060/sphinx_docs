# Settings for flake8 and mypy. Run them in the examples folder:
#   python -m flake8 .
#   python -m mypy .

[flake8]
max-line-length = 79
exclude = __pycache__

[mypy]
strict = True

# pandas does not ship type stubs. Ignore import errors for pandas.
# This section is not needed if pandas-stubs is installed.
[mypy-pandas.*]
ignore_missing_imports = True
