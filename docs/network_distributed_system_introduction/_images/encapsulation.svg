<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" width="640" height="350" font-family="sans-serif" font-size="12">
  <rect x="0" y="0" width="640" height="350" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666666"/>
    </marker>
  </defs>
  <!-- column title -->
  <text x="600" y="28" text-anchor="middle" fill="#555555">呼び名</text>
  <!-- layer labels -->
  <text x="12" y="67" font-size="13">アプリケーション層</text>
  <text x="12" y="137" font-size="13">トランスポート層</text>
  <text x="12" y="207" font-size="13">インターネット層</text>
  <text x="12" y="277" font-size="13">リンク層</text>
  <!-- row 1: application data -->
  <rect x="345" y="40" width="150" height="44" fill="#ececec" stroke="#666666"/>
  <text x="420" y="66" text-anchor="middle">アプリケーションデータ</text>
  <text x="600" y="66" text-anchor="middle">メッセージ</text>
  <!-- row 2: TCP segment -->
  <rect x="280" y="110" width="65" height="44" fill="#eef4fb" stroke="#4a78b0"/>
  <text x="312" y="128" text-anchor="middle">TCP</text>
  <text x="312" y="145" text-anchor="middle">ヘッダー</text>
  <rect x="345" y="110" width="150" height="44" fill="#ececec" stroke="#666666"/>
  <text x="420" y="136" text-anchor="middle">データ</text>
  <text x="600" y="136" text-anchor="middle">セグメント</text>
  <!-- row 3: IP packet -->
  <rect x="215" y="180" width="65" height="44" fill="#eaf5ea" stroke="#4a8a4a"/>
  <text x="247" y="198" text-anchor="middle">IP</text>
  <text x="247" y="215" text-anchor="middle">ヘッダー</text>
  <rect x="280" y="180" width="65" height="44" fill="#eef4fb" stroke="#4a78b0"/>
  <text x="312" y="198" text-anchor="middle">TCP</text>
  <text x="312" y="215" text-anchor="middle">ヘッダー</text>
  <rect x="345" y="180" width="150" height="44" fill="#ececec" stroke="#666666"/>
  <text x="420" y="206" text-anchor="middle">データ</text>
  <text x="600" y="206" text-anchor="middle">パケット</text>
  <!-- row 4: Ethernet frame -->
  <rect x="140" y="250" width="75" height="44" fill="#fbf1e6" stroke="#b07a3a"/>
  <text x="177" y="268" text-anchor="middle">Ethernet</text>
  <text x="177" y="285" text-anchor="middle">ヘッダー</text>
  <rect x="215" y="250" width="65" height="44" fill="#eaf5ea" stroke="#4a8a4a"/>
  <text x="247" y="268" text-anchor="middle">IP</text>
  <text x="247" y="285" text-anchor="middle">ヘッダー</text>
  <rect x="280" y="250" width="65" height="44" fill="#eef4fb" stroke="#4a78b0"/>
  <text x="312" y="268" text-anchor="middle">TCP</text>
  <text x="312" y="285" text-anchor="middle">ヘッダー</text>
  <rect x="345" y="250" width="150" height="44" fill="#ececec" stroke="#666666"/>
  <text x="420" y="276" text-anchor="middle">データ</text>
  <rect x="495" y="250" width="70" height="44" fill="#fbf1e6" stroke="#b07a3a"/>
  <text x="530" y="268" text-anchor="middle">FCS</text>
  <text x="530" y="285" text-anchor="middle">トレーラー</text>
  <text x="600" y="276" text-anchor="middle">フレーム</text>
  <!-- arrows between rows -->
  <g stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="420" y1="86" x2="420" y2="107"/>
    <line x1="420" y1="156" x2="420" y2="177"/>
    <line x1="420" y1="226" x2="420" y2="247"/>
  </g>
  <text x="320" y="330" text-anchor="middle" fill="#555555">送信側は上の層から順にヘッダーを付け、受信側は下の層から順に取り外します</text>
</svg>
