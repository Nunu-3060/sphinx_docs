<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 485" width="640" height="485" font-family="sans-serif" font-size="13">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="485" fill="#ffffff"/>
  <!-- participants -->
  <rect x="110" y="16" width="120" height="34" rx="6" fill="#eef4fb" stroke="#4a78b0"/>
  <text x="170" y="38" text-anchor="middle" font-size="14">クライアント</text>
  <rect x="410" y="16" width="120" height="34" rx="6" fill="#e9f5ea" stroke="#4a9050"/>
  <text x="470" y="38" text-anchor="middle" font-size="14">サーバー</text>
  <line x1="170" y1="50" x2="170" y2="390" stroke="#999999" stroke-dasharray="4,3"/>
  <line x1="470" y1="50" x2="470" y2="390" stroke="#999999" stroke-dasharray="4,3"/>
  <!-- 1: ClientHello -->
  <text x="160" y="80" text-anchor="end" font-size="12">ClientHello</text>
  <text x="160" y="96" text-anchor="end" font-size="12">+ key_share</text>
  <path d="M170,100 L468,150" stroke="#333333" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <!-- 2: server flight -->
  <text x="480" y="152" font-size="11" fill="#4a9050">（共有鍵を計算）</text>
  <text x="478" y="174" font-size="12">ServerHello</text>
  <text x="478" y="190" font-size="12">+ key_share</text>
  <text x="478" y="206" font-size="12">{EncryptedExtensions}</text>
  <text x="478" y="222" font-size="12">{Certificate}</text>
  <text x="478" y="238" font-size="12">{CertificateVerify}</text>
  <text x="478" y="254" font-size="12">{Finished}</text>
  <path d="M470,170 L172,220" stroke="#333333" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <!-- 3: client finished and data -->
  <text x="160" y="248" text-anchor="end" font-size="12">{Finished}</text>
  <text x="160" y="264" text-anchor="end" font-size="12">[Application Data]</text>
  <path d="M170,240 L468,290" stroke="#333333" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <!-- 4: server data -->
  <text x="478" y="320" font-size="12">[Application Data]</text>
  <path d="M470,315 L172,365" stroke="#333333" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <!-- 1-RTT bracket -->
  <path d="M110,100 L100,100 L100,220 L110,220" stroke="#b03a3a" stroke-width="1.5" fill="none"/>
  <text x="92" y="158" text-anchor="end" font-size="14" font-weight="bold" fill="#b03a3a">1-RTT</text>
  <text x="92" y="176" text-anchor="end" font-size="11" fill="#b03a3a">（往復 1 回）</text>
  <!-- legend -->
  <line x1="20" y1="405" x2="620" y2="405" stroke="#cccccc"/>
  <text x="30" y="428">括弧なし：平文（ClientHello と ServerHello）</text>
  <text x="30" y="448">{ }：ハンドシェイク用の鍵で暗号化した部分</text>
  <text x="30" y="468">[ ]：アプリケーションデータ用の鍵で暗号化した部分</text>
</svg>
