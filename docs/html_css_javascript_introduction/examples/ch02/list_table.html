<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>リストと表</title>
  <!-- 表の枠線は CSS で付ける (CSS は第 4 章で扱う) -->
  <style>
    table { border-collapse: collapse; }
    th, td { border: 1px solid #999; padding: 4px 8px; }
  </style>
</head>
<body>
  <h1>リストと表</h1>

  <h2>順序なしリスト (ul)</h2>
  <ul>
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
  </ul>

  <h2>順序付きリスト (ol)</h2>
  <ol>
    <li>HTML で構造を作る</li>
    <li>CSS で見た目を整える</li>
    <li>JavaScript で動きを付ける</li>
  </ol>

  <h2>表 (table)</h2>
  <table>
    <caption>言語と役割</caption>
    <thead>
      <tr>
        <th>言語</th>
        <th>役割</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>HTML</td>
        <td>構造</td>
      </tr>
      <tr>
        <td>CSS</td>
        <td>見た目</td>
      </tr>
      <tr>
        <td>JavaScript</td>
        <td>振る舞い</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
