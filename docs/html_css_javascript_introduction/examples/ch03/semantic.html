<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマートフォンで画面幅に合わせて表示するための指定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="セマンティック要素を使ったページの例">
  <title>セマンティック要素の例</title>
</head>
<body>
  <!-- ページ全体のヘッダー -->
  <header>
    <h1>技術ブログ</h1>
    <!-- 主要なナビゲーション -->
    <nav>
      <ul>
        <li><a href="#">ホーム</a></li>
        <li><a href="#">記事一覧</a></li>
        <li><a href="#">お問い合わせ</a></li>
      </ul>
    </nav>
  </header>

  <!-- ページの主要な内容。1 ページに 1 つだけ置く -->
  <main>
    <!-- それだけで完結する内容 (記事など) -->
    <article>
      <h2>HTML のセマンティック要素</h2>
      <p>公開日: <time datetime="2026-04-01">2026 年 4 月 1 日</time></p>

      <!-- 見出しを持つ内容のまとまり -->
      <section>
        <h3>なぜ意味で要素を選ぶのか</h3>
        <p>検索エンジンやスクリーンリーダーが、ページの構造を正しく理解できるようになる。</p>
      </section>

      <section>
        <h3>div との違い</h3>
        <p>div は意味を持たない。見た目を整えるためだけのまとまりには div を使う。</p>
      </section>
    </article>
  </main>

  <!-- ページ全体のフッター -->
  <footer>
    <p><small>&copy; 2026 prometech</small></p>
  </footer>
</body>
</html>
