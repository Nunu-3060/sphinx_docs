<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Storage の例</title>
</head>
<body>
  <h1>Web Storage の例</h1>
  <p>入力した内容はページを再読み込みしても残る。</p>

  <label for="memo">メモ</label><br>
  <textarea id="memo" rows="4" cols="40"></textarea>
  <p>
    <button id="clear-button" type="button">メモを消去</button>
  </p>
  <p>このページを開いた回数 (このタブ内): <span id="visit-count"></span></p>

  <script>
    const MEMO_KEY = "storage-sample-memo";
    const memo = document.querySelector("#memo");

    // localStorage: ブラウザを閉じても残る。値は文字列として保存される
    memo.value = localStorage.getItem(MEMO_KEY) ?? "";

    memo.addEventListener("input", () => {
      localStorage.setItem(MEMO_KEY, memo.value);
    });

    document.querySelector("#clear-button").addEventListener("click", () => {
      localStorage.removeItem(MEMO_KEY);
      memo.value = "";
    });

    // sessionStorage: タブを閉じると消える
    // 文字列しか保存できないため、数値は Number で変換する
    const count = Number(sessionStorage.getItem("visit-count") ?? "0") + 1;
    sessionStorage.setItem("visit-count", String(count));
    document.querySelector("#visit-count").textContent = count;
  </script>
</body>
</html>
