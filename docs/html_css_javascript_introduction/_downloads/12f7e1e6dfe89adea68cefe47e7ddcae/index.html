<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JavaScript モジュールの例</title>
  <!--
    type="module" を指定するとモジュールとして読み込まれ、import / export が使える。
    モジュールは file:// では読み込めないため、ローカルサーバー経由で開くこと。
    モジュールは defer と同じく、HTML の解析後に実行される。
  -->
  <script type="module" src="main.js"></script>
</head>
<body>
  <h1>JavaScript モジュールの例</h1>
  <p id="output">(ローカルサーバー経由で開くと、ここに計算結果が表示される)</p>
</body>
</html>
