<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#ffffff"/>
  <!-- input -->
  <rect x="10" y="40" width="120" height="56" rx="6" fill="#eeeeee" stroke="#888"/>
  <text x="70" y="64" text-anchor="middle">頂点データ</text>
  <text x="70" y="84" text-anchor="middle" font-size="12">（バッファー）</text>
  <!-- vertex shader -->
  <rect x="160" y="40" width="130" height="56" rx="6" fill="#ffe2b8" stroke="#d08a20"/>
  <text x="225" y="64" text-anchor="middle" font-weight="bold">頂点シェーダー</text>
  <text x="225" y="84" text-anchor="middle" font-size="12">頂点ごとに実行</text>
  <!-- primitive assembly -->
  <rect x="320" y="40" width="130" height="56" rx="6" fill="#dde8f5" stroke="#5a7fa8"/>
  <text x="385" y="64" text-anchor="middle">プリミティブの</text>
  <text x="385" y="84" text-anchor="middle">組み立て・クリッピング</text>
  <!-- rasterize -->
  <rect x="480" y="40" width="120" height="56" rx="6" fill="#dde8f5" stroke="#5a7fa8"/>
  <text x="540" y="64" text-anchor="middle">ラスタライズ</text>
  <text x="540" y="84" text-anchor="middle" font-size="12">（補間）</text>
  <!-- fragment shader -->
  <rect x="480" y="150" width="140" height="56" rx="6" fill="#ffe2b8" stroke="#d08a20"/>
  <text x="550" y="174" text-anchor="middle" font-weight="bold">フラグメント</text>
  <text x="550" y="194" text-anchor="middle" font-weight="bold">シェーダー</text>
  <!-- per-fragment ops -->
  <rect x="290" y="150" width="160" height="56" rx="6" fill="#dde8f5" stroke="#5a7fa8"/>
  <text x="370" y="174" text-anchor="middle">フラグメント単位の処理</text>
  <text x="370" y="194" text-anchor="middle" font-size="12">深度テスト・ブレンド</text>
  <!-- framebuffer -->
  <rect x="100" y="150" width="160" height="56" rx="6" fill="#eeeeee" stroke="#888"/>
  <text x="180" y="174" text-anchor="middle">フレームバッファー</text>
  <text x="180" y="194" text-anchor="middle" font-size="12">（canvas など）</text>
  <!-- arrows -->
  <line x1="130" y1="68" x2="158" y2="68" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="290" y1="68" x2="318" y2="68" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="68" x2="478" y2="68" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M600,68 L650,68 L650,178 L622,178" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="178" x2="452" y2="178" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="290" y1="178" x2="262" y2="178" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- uniforms -->
  <rect x="160" y="240" width="460" height="40" rx="6" fill="#f6f6f6" stroke="#aaa" stroke-dasharray="4 3"/>
  <text x="390" y="265" text-anchor="middle" font-size="13">uniform 変数・テクスチャ（両方のシェーダーから参照できる）</text>
  <line x1="225" y1="240" x2="225" y2="98" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="550" y1="240" x2="550" y2="208" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <!-- legend -->
  <rect x="10" y="10" width="14" height="14" fill="#ffe2b8" stroke="#d08a20"/>
  <text x="30" y="22" font-size="12">プログラムで記述する段階</text>
  <rect x="200" y="10" width="14" height="14" fill="#dde8f5" stroke="#5a7fa8"/>
  <text x="220" y="22" font-size="12">GPU が固定の処理を行う段階（設定のみ変更可能）</text>
</svg>
