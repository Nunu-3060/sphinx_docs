<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>04 頂点カラーとインターリーブ配置</title>
<style>
  body { margin: 16px; font-family: sans-serif; background: #f4f4f4; color: #222; }
  canvas { display: block; background: #000; max-width: 100%; }
  #error { color: #b00; white-space: pre-wrap; }
  .controls { margin: 8px 0; }
</style>
</head>
<body>
<h1>04 頂点カラーとインターリーブ配置</h1>
<p>頂点ごとに色を持たせ、三角形の内部で色が補間される様子を確認します。座標と色は 1 つのバッファーに交互に並べています。</p>
<pre id="error" hidden></pre>
<canvas id="canvas" width="640" height="480"></canvas>
<div class="controls">
  <label><input type="checkbox" id="flat"> 補間しない（flat 修飾子を使う）</label>
</div>

<script>
"use strict";

// ---- シェーダー ----
// 補間方法の修飾子（"" または "flat "）を埋め込んで 2 種類のシェーダーを作る
function vertexShaderSource(qualifier) {
  return `#version 300 es
layout(location = 0) in vec2 a_position;
layout(location = 1) in vec3 a_color;

// 頂点シェーダーの出力。ラスタライズの際に三角形の内部で補間される
${qualifier}out vec3 v_color;

void main() {
  v_color = a_color;
  gl_Position = vec4(a_position, 0.0, 1.0);
}
`;
}

function fragmentShaderSource(qualifier) {
  return `#version 300 es
precision mediump float;

// 頂点シェーダーの out と同じ名前・型で受け取る
${qualifier}in vec3 v_color;

out vec4 outColor;

void main() {
  outColor = vec4(v_color, 1.0);
}
`;
}

// ---- 共通の補助関数 ----
function showError(message) {
  const element = document.getElementById("error");
  element.textContent += message + "\n";
  element.hidden = false;
}

function createShader(gl, type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(shader);
    gl.deleteShader(shader);
    throw new Error("シェーダーのコンパイルに失敗しました。\n" + log);
  }
  return shader;
}

function createProgram(gl, vertexSource, fragmentSource) {
  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentSource);
  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);
  gl.deleteShader(vertexShader);
  gl.deleteShader(fragmentShader);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    const log = gl.getProgramInfoLog(program);
    gl.deleteProgram(program);
    throw new Error("プログラムのリンクに失敗しました。\n" + log);
  }
  return program;
}

// ---- メイン処理 ----
function main() {
  const canvas = document.getElementById("canvas");
  const gl = canvas.getContext("webgl2");
  if (!gl) {
    showError("このブラウザーは WebGL 2.0 に対応していません。");
    canvas.hidden = true;
    return;
  }

  const smoothProgram = createProgram(gl, vertexShaderSource(""), fragmentShaderSource(""));
  const flatProgram = createProgram(gl, vertexShaderSource("flat "), fragmentShaderSource("flat "));

  // 1 頂点あたり x, y, r, g, b の 5 個の float を交互に並べる（インターリーブ配置）
  const vertices = new Float32Array([
  //   x     y     r    g    b
     0.0,  0.7,  1.0, 0.0, 0.0,  // 上: 赤
    -0.7, -0.6,  0.0, 1.0, 0.0,  // 左下: 緑
     0.7, -0.6,  0.0, 0.0, 1.0,  // 右下: 青
  ]);
  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

  const FLOAT_SIZE = Float32Array.BYTES_PER_ELEMENT;  // 4 バイト
  const stride = 5 * FLOAT_SIZE;  // 1 頂点分のバイト数（20 バイト）

  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  // a_position: 各頂点の先頭から float を 2 個
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, stride, 0);
  // a_color: 各頂点の 8 バイト目から float を 3 個
  gl.enableVertexAttribArray(1);
  gl.vertexAttribPointer(1, 3, gl.FLOAT, false, stride, 2 * FLOAT_SIZE);
  gl.bindVertexArray(null);

  function render() {
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0.1, 0.1, 0.1, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT);

    // flat の場合は、三角形の最後の頂点（右下の青）の値が三角形全体に使われる
    const useFlat = document.getElementById("flat").checked;
    gl.useProgram(useFlat ? flatProgram : smoothProgram);
    gl.bindVertexArray(vao);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindVertexArray(null);
  }

  render();
  document.getElementById("flat").addEventListener("change", render);
}

try {
  main();
} catch (error) {
  showError(error.message);
}
</script>
</body>
</html>
