# Settings for checking the sample code in this directory.
# Run the following commands in this directory:
#   flake8
#   mypy .
# Keep this file ASCII only: mypy reads it with the locale encoding
# (cp932 on Japanese Windows), so non-ASCII characters break it.

[flake8]
max-line-length = 120
exclude = .mypy_cache,__pycache__

[mypy]
strict = True
