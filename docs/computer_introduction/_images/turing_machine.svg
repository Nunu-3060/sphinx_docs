<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 230" width="520" height="230" font-family="sans-serif" font-size="14">
  <rect x="0" y="0" width="520" height="230" fill="#ffffff"/>
  <!-- tape -->
  <g stroke="#333333" stroke-width="1.5" fill="#f4f6f8">
    <rect x="40" y="30" width="48" height="40"/>
    <rect x="88" y="30" width="48" height="40"/>
    <rect x="136" y="30" width="48" height="40"/>
    <rect x="184" y="30" width="48" height="40" fill="#fff3c4"/>
    <rect x="232" y="30" width="48" height="40"/>
    <rect x="280" y="30" width="48" height="40"/>
    <rect x="328" y="30" width="48" height="40"/>
    <rect x="376" y="30" width="48" height="40"/>
    <rect x="424" y="30" width="48" height="40"/>
  </g>
  <g fill="#222222" text-anchor="middle" font-size="18" font-family="monospace">
    <text x="64" y="56">_</text>
    <text x="112" y="56">1</text>
    <text x="160" y="56">0</text>
    <text x="208" y="56">1</text>
    <text x="256" y="56">1</text>
    <text x="304" y="56">_</text>
    <text x="352" y="56">_</text>
    <text x="400" y="56">_</text>
    <text x="448" y="56">_</text>
  </g>
  <text x="18" y="56" fill="#555555" text-anchor="middle" font-size="18">…</text>
  <text x="496" y="56" fill="#555555" text-anchor="middle" font-size="18">…</text>
  <text x="256" y="20" fill="#333333" text-anchor="middle">テープ（両方向に無限に続く）</text>
  <!-- head -->
  <polygon points="208,74 196,96 220,96" fill="#2b6cb0"/>
  <line x1="208" y1="96" x2="208" y2="130" stroke="#2b6cb0" stroke-width="3"/>
  <text x="232" y="92" fill="#2b6cb0">ヘッド（読み書きと左右への移動）</text>
  <!-- control unit -->
  <rect x="98" y="130" width="220" height="80" rx="8" fill="#e8f0fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="208" y="156" fill="#1a365d" text-anchor="middle">制御部</text>
  <text x="208" y="178" fill="#1a365d" text-anchor="middle">現在の状態：right</text>
  <text x="208" y="198" fill="#1a365d" text-anchor="middle">遷移規則の表</text>
</svg>
