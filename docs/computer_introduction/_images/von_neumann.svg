<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" font-family="sans-serif" font-size="14">
  <rect x="0" y="0" width="560" height="300" fill="#ffffff"/>
  <!-- CPU -->
  <rect x="20" y="20" width="250" height="180" rx="8" fill="#e8f0fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="145" y="42" fill="#1a365d" text-anchor="middle" font-weight="bold">CPU</text>
  <rect x="36" y="56" width="104" height="56" rx="4" fill="#ffffff" stroke="#2b6cb0"/>
  <text x="88" y="80" fill="#1a365d" text-anchor="middle">制御装置</text>
  <text x="88" y="100" fill="#4a5568" text-anchor="middle" font-size="12">命令の解読</text>
  <rect x="150" y="56" width="104" height="56" rx="4" fill="#ffffff" stroke="#2b6cb0"/>
  <text x="202" y="80" fill="#1a365d" text-anchor="middle">ALU</text>
  <text x="202" y="100" fill="#4a5568" text-anchor="middle" font-size="12">演算</text>
  <rect x="36" y="124" width="218" height="60" rx="4" fill="#ffffff" stroke="#2b6cb0"/>
  <text x="145" y="148" fill="#1a365d" text-anchor="middle">レジスタ</text>
  <text x="145" y="168" fill="#4a5568" text-anchor="middle" font-size="12">PC、IR、汎用レジスタ、フラグ</text>
  <!-- Memory -->
  <rect x="300" y="20" width="240" height="180" rx="8" fill="#eef7ee" stroke="#2f855a" stroke-width="2"/>
  <text x="420" y="42" fill="#22543d" text-anchor="middle" font-weight="bold">主記憶</text>
  <g font-family="monospace" font-size="13" fill="#22543d">
    <rect x="320" y="56" width="200" height="26" fill="#ffffff" stroke="#2f855a"/>
    <text x="330" y="74">0: 命令</text>
    <rect x="320" y="82" width="200" height="26" fill="#ffffff" stroke="#2f855a"/>
    <text x="330" y="100">1: 命令</text>
    <rect x="320" y="108" width="200" height="26" fill="#ffffff" stroke="#2f855a"/>
    <text x="330" y="126">…</text>
    <rect x="320" y="134" width="200" height="26" fill="#fffbea" stroke="#2f855a"/>
    <text x="330" y="152">20: データ</text>
    <rect x="320" y="160" width="200" height="26" fill="#fffbea" stroke="#2f855a"/>
    <text x="330" y="178">21: データ</text>
  </g>
  <!-- Bus -->
  <rect x="20" y="228" width="520" height="22" rx="4" fill="#4a5568"/>
  <text x="280" y="244" fill="#ffffff" text-anchor="middle" font-size="13">バス（アドレス・データ・制御信号）</text>
  <line x1="145" y1="200" x2="145" y2="228" stroke="#4a5568" stroke-width="4"/>
  <line x1="420" y1="200" x2="420" y2="228" stroke="#4a5568" stroke-width="4"/>
  <line x1="145" y1="250" x2="145" y2="262" stroke="#4a5568" stroke-width="4"/>
  <line x1="420" y1="250" x2="420" y2="262" stroke="#4a5568" stroke-width="4"/>
  <!-- I/O -->
  <rect x="60" y="262" width="170" height="32" rx="6" fill="#faf0e6" stroke="#c05621" stroke-width="2"/>
  <text x="145" y="283" fill="#7b341e" text-anchor="middle">入力装置</text>
  <rect x="335" y="262" width="170" height="32" rx="6" fill="#faf0e6" stroke="#c05621" stroke-width="2"/>
  <text x="420" y="283" fill="#7b341e" text-anchor="middle">出力装置</text>
</svg>
